name: build

on:
  schedule:
    - cron: "17 8 * * 0"      # every Sunday, 3:17am Eastern (8:17 UTC)
  workflow_dispatch:           # "Run workflow" button for manual runs
  push:
    branches: [main]
    paths:
      - "config/**"
      - "plates/**"
      - "logos/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render covers and backgrounds
        env:
          PYTHONUNBUFFERED: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m plates.build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the 3 newest runs
        run: |
          gh api "repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status=="completed")][3:][] | .id' |
          while read -r id; do gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" || true; done

      - name: Keep only the live deployment
        run: |
          gh api "repos/$GH_REPO/deployments?per_page=100" --jq '.[1:][] | .id' |
          while read -r id; do
            gh api -X POST "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive >/dev/null || true
            gh api -X DELETE "repos/$GH_REPO/deployments/$id" || true
          done
