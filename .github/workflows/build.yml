name: build

on:
  schedule:
    - cron: "17 8 * * 0"      # every Sunday, 3:17am Eastern (8:17 UTC)
  workflow_dispatch:           # "Run workflow" button for manual runs
  push:
    branches: [main]
    paths:
      - "config/**"
      - "plates/**"
      - "logos/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Apply the latest shelf plan
        run: |
          python tools/apply_plan.py
          git add -A config logos
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Apply shelf plan"
            git push -q origin HEAD:main
          fi

      - name: Render covers and backgrounds
        env:
          PYTHONUNBUFFERED: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m plates.build

      - name: Pack small previews for the editing page
        run: python -m plates.thumbs --site site --out thumbs/thumbs.json

      - name: Publish previews to the thumbs branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd thumbs
          git init -q -b thumbs
          git add thumbs.json
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "previews"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" thumbs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove old and cancelled runs
        run: |
          # keep: this run, the newest successful build, the newest logo save. Delete everything else that finished.
          gh api "repos/$GH_REPO/actions/runs?per_page=100" --jq '
            [.workflow_runs[] | select(.status=="completed")] as $done
            | ([$done[] | select(.name=="build" and .conclusion=="success")][0].id) as $lastbuild
            | ([$done[] | select(.name=="save logo links" and .conclusion=="success")][0].id) as $lastsave
            | $done[] | select(.id != $lastbuild and .id != $lastsave) | .id' |
          while read -r id; do gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" || true; done

      - name: Keep only the live deployment
        run: |
          gh api "repos/$GH_REPO/deployments?per_page=100" --jq '.[1:][] | .id' |
          while read -r id; do
            gh api -X POST "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive >/dev/null || true
            gh api -X DELETE "repos/$GH_REPO/deployments/$id" || true
          done
