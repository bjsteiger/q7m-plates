name: build

on:
  schedule:
    - cron: "17 8 * * 0"      # every Sunday, 3:17am Eastern (8:17 UTC)
  workflow_dispatch:           # "Run workflow" button for manual runs
  push:
    branches: [main]
    paths:
      - "config/**"
      - "plates/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render covers and backgrounds
        env:
          PYTHONUNBUFFERED: "1"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m plates.build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
