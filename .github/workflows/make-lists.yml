name: Make TMDB person lists
on:
  workflow_dispatch:
    inputs:
      people:
        description: "Comma separated names, one public list of movies is made for each"
        required: false
        default: ""
      request_token:
        description: "Leave empty to get an approval link. After approving, run again with the token from that link"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ask for approval, then make the lists
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PEOPLE: ${{ inputs.people }}
          REQ: ${{ inputs.request_token }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.parse
          key = os.environ["TMDB_API_KEY"].strip()
          def call(method, path, body=None, **q):
              q["api_key"] = key
              req = urllib.request.Request(f"https://api.themoviedb.org/3{path}?" + urllib.parse.urlencode(q), method=method,
                  data=json.dumps(body).encode() if body is not None else None, headers={"Content-Type": "application/json;charset=utf-8"})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  return {"_error": e.code, **(json.loads(e.read() or b"{}") or {})}
          rt = os.environ.get("REQ", "").strip()
          if not rt:       # step one: hand out the approval link and stop
              rt = call("GET", "/authentication/token/new")["request_token"]
              print("APPROVE_URL https://www.themoviedb.org/authenticate/" + rt, flush=True); raise SystemExit(0)
          r = call("POST", "/authentication/session/new", {"request_token": rt})
          sid = r.get("session_id")
          if not sid:
              print("NOT_APPROVED", r); raise SystemExit(1)
          print("APPROVED", flush=True)
          for name in [p.strip() for p in os.environ["PEOPLE"].split(",") if p.strip()]:
              s = call("GET", "/search/person", query=name)
              hits = [p for p in s.get("results", []) if p.get("known_for_department") == "Acting"] or s.get("results", [])
              if not hits: print("NO_PERSON", name); continue
              pid = hits[0]["id"]
              cr = call("GET", f"/person/{pid}/movie_credits").get("cast", [])
              seen, movies = set(), []
              for m in sorted(cr, key=lambda m: -(m.get("popularity") or 0)):
                  g = m.get("genre_ids") or []
                  if m["id"] in seen or 99 in g or 27 in g or not m.get("release_date") or (m.get("vote_count") or 0) < 20: continue
                  if (m.get("character") or "").lower() in ("herself", "self", "narrator (voice)"): continue
                  seen.add(m["id"]); movies.append(m["id"])
              lst = call("POST", "/list", {"name": name, "description": f"Movies with {name}", "language": "en"}, session_id=sid)
              lid = lst.get("list_id")
              if not lid: print("LIST_FAILED", name, lst); continue
              ok = 0
              for x in movies:
                  r = call("POST", f"/list/{lid}/add_item", {"media_id": x}, session_id=sid)
                  ok += 1 if r.get("success") or r.get("status_code") in (1, 12) else 0
                  time.sleep(0.15)
              print(f"LIST {name} | {lid} | {ok} of {len(movies)} movies | person {pid}", flush=True)
          call("DELETE", "/authentication/session", {"session_id": sid})     # sign the job out again
          PY
